  <line x1="46" y1="22" x2="51" y2="33" stroke="#C5A059" stroke-width="1.5" />
  <path d="M38 33 C38 41, 54 41, 54 33 Z" fill="rgba(197, 160, 89, 0.08)" stroke="#C5A059" stroke-width="2" />

