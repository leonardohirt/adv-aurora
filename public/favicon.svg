<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Dark Background Circle for High Contrast on Browser Tabs -->
  <circle cx="32" cy="32" r="32" fill="#0A0B0E" />
  
  <!-- Outer Gold Circle Frame -->
  <circle cx="32" cy="32" r="28" stroke="#C5A059" stroke-width="3" fill="none"/>

  <!-- Central Pillar Line -->
  <line x1="32" y1="16" x2="32" y2="48" stroke="#C5A059" stroke-width="3.5" stroke-linecap="round" />

  <!-- Scale Crossbar -->
  <line x1="18" y1="23" x2="46" y2="23" stroke="#C5A059" stroke-width="3.5" stroke-linecap="round" />

  <!-- Left Pan Chains & Bowl -->
  <line x1="18" y1="23" x2="13" y2="34" stroke="#C5A059" stroke-width="2" />
  <line x1="18" y1="23" x2="23" y2="34" stroke="#C5A059" stroke-width="2" />
  <path d="M10 34 C10 42, 26 42, 26 34 Z" fill="none" stroke="#C5A059" stroke-width="2.5" />

  <!-- Right Pan Chains & Bowl -->
  <line x1="46" y1="23" x2="41" y2="34" stroke="#C5A059" stroke-width="2" />
  <line x1="46" y1="23" x2="51" y2="34" stroke="#C5A059" stroke-width="2" />
  <path d="M38 34 C38 42, 54 42, 54 34 Z" fill="none" stroke="#C5A059" stroke-width="2.5" />

  <!-- Base Stand -->
